<svg viewBox="0 0 680 420" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>一次发版需要同步的版本号位置</title>
<desc>展示 v1.6.1 发版时哪些位置同步了版本号、哪些漏掉了，以及现在的 6 组同步清单</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="30" font-size="15" font-weight="500" fill="#2C2C2A">一次发版，版本号要同步到多个位置</text>

<g>
  <rect x="40" y="50" width="600" height="150" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="56" y="74" font-size="13" font-weight="500" fill="#2C2C2A">v1.6.1 发版时的实际情况</text>

  <rect x="56" y="90" width="170" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="141" y="112" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">agent.md ✅ 已同步</text>

  <rect x="246" y="90" width="170" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="331" y="112" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">prompts ✅ 已同步</text>

  <rect x="436" y="90" width="188" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="530" y="112" font-size="13" font-weight="500" fill="#501313" text-anchor="middle" dominant-baseline="central">plugin.json ❌ 漏了</text>

  <text x="56" y="158" font-size="12" fill="#444441">当时只改了 agent.md 和 prompts，忘了 plugin.json → 本地副本还停在 1.6.0</text>
  <text x="56" y="178" font-size="12" fill="#444441">安装后在专家列表里看到的版本号与实际内容不一致</text>
</g>

<text x="40" y="228" font-size="15" font-weight="500" fill="#2C2C2A">现在：按 6 组清单核对，缺一不可</text>

<g>
  <rect x="40" y="248" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="110" y="268" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">A. agent.md</text>
  <text x="110" y="288" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">根+镜像+副本</text>

  <rect x="195" y="248" width="140" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="265" y="268" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">B. plugin.json</text>
  <text x="265" y="288" font-size="12" fill="#633806" text-anchor="middle" dominant-baseline="central">最易漏的一组</text>

  <rect x="350" y="248" width="140" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="420" y="268" font-size="13" font-weight="500" fill="#173404" text-anchor="middle" dominant-baseline="central">C. README</text>
  <text x="420" y="288" font-size="12" fill="#27500A" text-anchor="middle" dominant-baseline="central">根+镜像</text>

  <rect x="505" y="248" width="135" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="572" y="268" font-size="13" font-weight="500" fill="#4B1528" text-anchor="middle" dominant-baseline="central">D. docs 手册</text>
  <text x="572" y="288" font-size="12" fill="#72243E" text-anchor="middle" dominant-baseline="central">两份手册</text>

  <rect x="40" y="316" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="110" y="336" font-size="13" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">E. prompts</text>
  <text x="110" y="356" font-size="12" fill="#712B13" text-anchor="middle" dominant-baseline="central">5 个步骤</text>

  <rect x="195" y="316" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="265" y="336" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">F. skill/zip</text>
  <text x="265" y="356" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">独立 v5.x 体系</text>
</g>

<rect x="40" y="388" width="600" height="24" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="400" font-size="12" fill="#04342C" text-anchor="middle" dominant-baseline="central">发版前跑 check_version_sync.py --set X.Y.Z，自动比对 6 组所有位置</text>
</svg>
